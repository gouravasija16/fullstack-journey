<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dice &amp; Draw</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Dice <span>&amp;</span> Draw</h1>
    <p class="sub">Board game cafe. Pick a game, book a table.</p>
  </header>

  <main>
    <form id="filters" class="controls" role="search" aria-label="Filter games">
      <label>Category
        <select id="category"><option value="">All categories</option></select>
      </label>
      <label class="grow">Search
        <input id="search" type="search" placeholder="Search by title">
      </label>
      <label>Players
        <select id="players">
          <option value="">Any</option>
          <option>1</option><option>2</option><option>3</option><option>4</option>
          <option>5</option><option>6</option><option>7</option><option>8</option>
        </select>
      </label>
      <label>Max time
        <select id="maxMinutes">
          <option value="">Any</option>
          <option value="30">30 min</option><option value="60">60 min</option><option value="90">90 min</option>
        </select>
      </label>
    </form>

    <p id="status" class="status" role="status" aria-live="polite">Loading games…</p>
    <ul id="grid" class="grid"></ul>
  </main>

  <dialog id="book">
    <form id="bookForm" method="dialog">
      <h2>Reserve <span id="bookTitle"></span></h2>
      <input type="hidden" id="gameId">
      <label>Your name <input id="name" maxlength="60" required></label>
      <div class="two">
        <label>Players <input id="bookPlayers" type="number" min="1" required></label>
        <label>Date <input id="date" type="date" required></label>
      </div>
      <div class="two">
        <label>Start time
          <select id="startHour"></select>
        </label>
        <label>Hours
          <select id="hours"><option>1</option><option>2</option><option>3</option><option>4</option></select>
        </label>
      </div>
      <p id="bookMsg" class="status" role="status" aria-live="polite"></p>
      <div class="actions">
        <button type="button" id="cancel" class="ghost">Cancel</button>
        <button type="submit" id="confirm">Confirm booking</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
